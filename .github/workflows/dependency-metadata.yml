name: Dependency metadata
# Manual tool for a reviewed dependency change: resolves every build, test and lint
# configuration, regenerates SHA-256 verification metadata and lockfiles and uploads
# them as a patch. Nothing is committed automatically; review the patch before use.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-metadata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Resolve dependencies and write metadata
        shell: bash
        run: |
          set +e
          bash ./gradlew --no-configuration-cache --continue \
            --write-verification-metadata sha256 --write-locks \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 \
            -Porg.gradle.java.installations.auto-download=false \
            :core:dependencies :app:dependencies \
            :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            :app:assembleRelease :app:lintRelease
          echo "GRADLE_STATUS=$?" >> "$GITHUB_ENV"
      - name: Collect metadata patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata-patch
          git add -A -- gradle/verification-metadata.xml ':(glob)**/*.lockfile' ':(glob)*.lockfile'
          git diff --cached --stat | tee metadata-patch/STAT.txt
          git diff --cached > metadata-patch/dependency-metadata.patch
          printf 'commit=%s\nrun=%s\ngradle_status=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GRADLE_STATUS" > metadata-patch/BUILD.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-metadata-${{ github.run_number }}
          path: metadata-patch/
          if-no-files-found: error
          retention-days: 3
      - name: Report Gradle result
        if: env.GRADLE_STATUS != '0'
        run: |
          echo "Gradle finished with status $GRADLE_STATUS; the patch may be incomplete."
          exit 1
